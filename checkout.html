<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">
        <h2 style="background: var(--accent-gradient); background-clip: text; -webkit-text-fill-color: transparent;">EcoShop</h2>
    </div>
    <nav>
        <ul>
            <li><a href="landing.html">Home</a></li>
            <li><a href="cart.html">Back to Cart</a></li>
        </ul>
    </nav>
</header>

<main class="checkout-container" style="max-width: 1100px; margin: 30px auto; padding: 0 20px;">
    <h1 style="margin-bottom: 30px;">Checkout</h1>

    <div class="checkout-layout">
        <section class="shipping-info">
            <div class="card" style="background: white; padding: 30px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 20px;">
                <h3 style="margin-bottom: 20px; color: var(--accent-color);">1. Shipping Address</h3>
                <fieldset style="border: none; display: flex; flex-direction: column; gap: 15px;">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="Juan Dela Cruz" required style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px;">
                    </div>
                    <div class="form-group">
                        <label for="street">Street Address</label>
                        <input type="text" id="street" placeholder="123 Modern St." required style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px;">
                    </div>
                    <div style="display: flex; gap: 15px;">
                        <div style="flex: 1;">
                            <label for="zip">Zip Code</label>
                            <input type="text" id="zip" placeholder="1000" required style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px;">
                        </div>
                        <div style="flex: 2;">
                            <label for="city">City</label>
                            <input type="text" id="city" placeholder="Manila" required style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px;">
                        </div>
                    </div>
                </fieldset>
            </div>

            <div class="card" style="background: white; padding: 30px; border-radius: var(--radius); box-shadow: var(--shadow);">
                <h3 style="margin-bottom: 20px; color: var(--accent-color);">2. Payment Method</h3>
                <form class="payment-methods" style="display: flex; flex-direction: column; gap: 12px;">
                    <label class="payment-option">
                        <input type="radio" name="pay" value="cc" checked> Credit Card
                    </label>
                    <label class="payment-option">
                        <input type="radio" name="pay" value="pp"> PayPal
                    </label>
                    <label class="payment-option">
                        <input type="radio" name="pay" value="gc"> GCash
                    </label>
                    <label class="payment-option">
                        <input type="radio" name="pay" value="pm"> PayMaya
                    </label>
                    
                    <button type="submit" style="margin-top: 20px; width: 100%; font-size: 1.1rem; letter-spacing: 1px;">PLACE ORDER NOW</button>
                </form>
            </div>
        </section>

        <aside class="order-summary-sticky">
            <div class="card" style="background: white; padding: 25px; border-radius: var(--radius); box-shadow: var(--shadow); border: 2px solid var(--accent-color);">
                <h3 style="margin-bottom: 15px;">Order Summary</h3>
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                    <span>Subtotal</span>
                    <span>$25.00</span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                    <span>Shipping</span>
                    <span style="color: var(--success-color);">FREE</span>
                </div>
                <hr style="margin: 15px 0; border: 0; border-top: 1px solid var(--border-color);">
                <div style="display: flex; justify-content: space-between; font-size: 1.3rem; font-weight: bold;">
                    <span>Total</span>
                    <span style="color: var(--accent-color);">$25.00</span>
                </div>
                <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 15px; text-align: center;">
                    🔒 Encrypted & Secure Checkout
                </p>
            </div>
        </aside>
    </div>
</main>

</body>
</html>
