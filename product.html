<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Our Products | EcoShop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">
        <h2 style="background: var(--accent-gradient); background-clip: text; -webkit-text-fill-color: transparent;">EcoShop</h2>
    </div>
    <nav>
        <ul>
            <li><a href="landing.html">Home</a></li>
            <li><a href="cart.html">Cart</a></li>
        </ul>
    </nav>
</header>

<main class="main-layout" style="max-width: 1300px; margin: 0 auto;">
    
    <aside style="background: white; padding: 25px; border-radius: var(--radius); box-shadow: var(--shadow); height: fit-content;">
        <h3 style="margin-bottom: 20px; border-bottom: 2px solid var(--bg-light); padding-bottom: 10px;">Filters</h3>
        <form>
            <div style="margin-bottom: 25px;">
                <p style="font-weight: bold; margin-bottom: 10px;">Category</p>
                <label style="display: block; margin-bottom: 8px;"><input type="checkbox" checked> Technology</label>
                <label style="display: block; margin-bottom: 8px;"><input type="checkbox"> Home Office</label>
                <label style="display: block; margin-bottom: 8px;"><input type="checkbox"> Outdoors</label>
            </div>
            
            <div style="margin-bottom: 25px;">
                <p style="font-weight: bold; margin-bottom: 10px;">Price Range</p>
                <label style="display: block; margin-bottom: 8px;"><input type="radio" name="price"> Under $50</label>
                <label style="display: block; margin-bottom: 8px;"><input type="radio" name="price" checked> $50 - $200</label>
                <label style="display: block; margin-bottom: 8px;"><input type="radio" name="price"> $200+</label>
            </div>
            
            <button type="button" style="width: 100%; font-size: 0.9rem;">Apply Filters</button>
        </form>
    </aside>

    <section class="product-grid">
        <article>
            <img src="wireless.jpg" alt="Wireless Headphones">
            <h3 style="margin: 15px 0 5px 0; font-size: 1.1rem;">Wireless Headphones</h3>
            <p style="color: var(--accent-color); font-weight: bold; font-size: 1.2rem; margin-bottom: 15px;">$99.00</p>
            <a href="detail.html" style="text-decoration: none; color: var(--text-muted); font-weight: 500; font-size: 0.9rem; border-bottom: 1px solid var(--accent-color);">View Details →</a>
        </article>

        <article>
            <img src="water_bottle.jpg" alt="Water Bottle">
            <h3 style="margin: 15px 0 5px 0; font-size: 1.1rem;">Eco Water Bottle</h3>
            <p style="color: var(--accent-color); font-weight: bold; font-size: 1.2rem; margin-bottom: 15px;">$25.00</p>
            <a href="detail.html" style="text-decoration: none; color: var(--text-muted); font-weight: 500; font-size: 0.9rem; border-bottom: 1px solid var(--accent-color);">View Details →</a>
        </article>

        <article>
            <img src="wireless.jpg" alt="Wireless Headphones">
            <h3 style="margin: 15px 0 5px 0; font-size: 1.1rem;">Pro Audio Kit</h3>
            <p style="color: var(--accent-color); font-weight: bold; font-size: 1.2rem; margin-bottom: 15px;">$149.00</p>
            <a href="detail.html" style="text-decoration: none; color: var(--text-muted); font-weight: 500; font-size: 0.9rem; border-bottom: 1px solid var(--accent-color);">View Details →</a>
        </article>

        <article>
            <img src="water_bottle.jpg" alt="Water Bottle">
            <h3 style="margin: 15px 0 5px 0; font-size: 1.1rem;">Reusable Flask</h3>
            <p style="color: var(--accent-color); font-weight: bold; font-size: 1.2rem; margin-bottom: 15px;">$35.00</p>
            <a href="detail.html" style="text-decoration: none; color: var(--text-muted); font-weight: 500; font-size: 0.9rem; border-bottom: 1px solid var(--accent-color);">View Details →</a>
        </article>
    </section>
</main>

</body>
</html>
